## 审查能力（附属，需用对抗性 prompt）

审查时任务是**找问题**，不是验证正确性，以最严苛的标准审视。检查项就是本文件的【7 Gate】+【禁止事项】+【写完后对话自检】，外加两条只在审查时用的量化线：句式多样性（SVO 同构连续 5 段以上、通篇同长度即使每段合规仍是 AI 腔）、身体部位同一词全文 ≤ 5 次。评分体系（五维评分 + 通用 9 项清单）见 `story-setup/references/agent-references/quality-checklist.md`。

被 story-review spawn 时，以其 prompt 内联的 rubric 与 AI 味摘要为准，本节只作兜底。

---

## 禁止事项

- **禁止写总结感悟**：「他终于明白了……」「这一夜注定无人入眠」，用动作或对话收尾
- **禁止连续排比**：三段以上相同句式结构是 AI 指纹，必须打散
- **禁止高置信否定铺垫后再肯定翻转**：同句「不是A，(而)是B」「没有X，没有Y，只是Z」直接写肯定内容，或让动作/细节承担对比。跨段「不是A / 也不是B / 只是C」、`至于X不X，怎么X`、同动词 `不V A，不V B` 只作语义复核（advisory），叙述和台词同口径：重复细纲或拖慢画面时改，承担辩解、悬念排除或情绪递进时可保留
- **禁止通篇句号化或随机标点堆砌**：标点必须服务语气和人物声线；质问用 `？`，爆发峰值少量 `！`；犹豫/未尽/打断/拖长用动作、短句或换行承担
- **情绪词默认外化**：「悲伤」「愤怒」「恐惧」默认用身体状态替代，一处到位即可（短篇题材包要求情绪直给时按题材包，见 Gate C）
- **禁止万能/堆叠比喻**：「像潮水般」「如闪电般」「仿佛春风」这类模板比喻要删或白描；单个生活化、角色化、承担信息/情绪功能的比喻可以保留
- **禁止章末预告**：「他不知道的是，更大的风暴即将来临」-- 让读者自己感受悬念
- **禁止无功能解释腔/上帝视角/安排感**：不跳出角色当下解释因果（之所以/原来/这意味着）、不剧透预告（她不知道的是/殊不知/多年以后）、不替读者总结定性（演得真好/这出戏她看过一遍）、不为后文硬塞铺垫。边界见 Gate G
- **禁止正文段落间空行**：正文相邻段落之间只允许一个换行符 `\\n`，不得出现空行或连续换行 `\\n\\n`
- **禁止正文混入章节元信息**：见「正文元信息隔离」一节
- **禁止温吞保守**：爽点/冲突不许点到为止；该狠该爽该炸时往烈了写，不写"稳重克制"的寡淡反应
- **避免信息过载**：三维度揉进后不要一段到底；读起来卡、逗号串太长或多个完整动作挤在一段里时，按新动作/新物件/新信息/新对话拆分
- **禁止空转**：每个句子必须推动情节/情绪/代入感至少一项，否则删除
- **禁止角色千篇一律**：对话必须匹配 character-designer 的语言风格档案，不能互换
- **禁止自我重复**：同一身体部位/同一比喻/同一句式全文出现超过上限即触发修改

