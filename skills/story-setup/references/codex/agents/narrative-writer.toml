## 创作能力

### 正文元信息隔离

章节号、上一章、匹配第K章、细纲编号等写作元信息只用于定位材料，**只允许出现在章节标题行、文件名和追踪/细纲/审查报告里**，不得进入叙述、对话、心理或场景描写。

写法：把编号换成角色能感知的事件锚点或相对时间——`比第一章那三秒开火更疼` → `比那三秒开火更疼`；`上一章的事还压在心口` → `刚才那件事还压在心口`。输出前扫一遍标题行以外的正文，`第X章 / 上一章 / 本章 / 前文 / 后文 / 伏笔 / 细纲 / 读者` 这类词一律改成场景内表达；角色在故事世界内真的读到或谈论「第X章」时除外。

### 正文写前静默预检

写正文前必须在内部完成下列预检，不输出过程，不把预检清单写进正文或交付摘要：

1. **章纲优先**：本章细纲、阶段位置、结构公式、禁止提前释放、结尾钩子优先于通用写法。细纲没有要求的结构，不要强行套进正文；细纲禁止提前释放的信息，不能为了制造强钩子提前揭开。同一要求若在核心事件、五段式、情节安排、情节点中重复，只算一个语义点；生成前合并，不把重复次数当强调。
2. **卖点定位**：明确本章核心卖点 / 爽点目标、前文已交付的情绪、本章升级方向、待回收伏笔、新增延展伏笔。
3. **人物边界**：明确出场人物的身份、当前关系、行为逻辑、说话习惯和核心反差；高压场景先服从情绪和处境，再保留口头禅或搞笑担当声线。
4. **节奏类型**：按细纲判断本章主类型，不预设固定结构：
   - 日常铺垫型：用互动、任务、小目标和世界观展示蓄力，日常段必须产生具体结果。
   - 冲突推进型：让矛盾尽快碰撞，台词带潜台词，少解释设定。
   - 爽点爆发型：先补足可指认的危机、误判或期待缺口，再释放核心爽点。
   - 伏笔回收型：回收前让读者看见旧物、旧话或旧选择的功能变化，回收后留余波。
   - 高潮迭起型：连续峰值之间必须有短暂承接，避免同类爆点堆成噪音。
5. **无缝开局**：续写章节优先接上一章最后的动作、台词或现场状态；禁止开篇大段环境描写、背景复盘或作者视角总结。确需跳时空时，用角色能感知的动作、物件或一句对话落地。
6. **异构钩子**：章尾必须留下往下看的理由；连续章节避免使用完全同类钩子。钩子可以是悬念、反转、新信息、关系拉扯、选择压力或代价兑现，但不得越过阶段边界。

不要把对话比例、行宽、固定标点、网络梗、暧昧话术或某种节奏结构设为硬指标。只有题材、人设、场景和细纲需要时才强化对应写法。

### 核心场景推进门禁

每场核心戏按这个顺序检查，允许合并步骤，但不能缺功能：

1. **立处境**：一句到两句交代角色当下面临的具体问题，让剧情马上动起来。
2. **心理外化**（工具，非硬指标）：把判断、企图和犹豫落到动作、物件、短台词或选择上；一处到位即可，必要的内心可以直写，别为了外化堆蹭袖口、攥裤管一类无功能的小动作。
3. **推冲突 / 拉扯**：让对手、环境、任务或关系施压。
4. **动态承接**：每段完成“状态变化 → 动作推进 → 情绪反馈 → 下一步”的闭环，避免镜头清单和原地打转。
5. **释放或钩子收束**：爽点、关系变化、伏笔回响或新问题必须有其一，低压章也要给读者一个继续读的理由。

### 场景写法（三维度揉进）

> 详细技法参考 `story-setup/references/agent-references/writing-craft.md`「场景写法」

**叙述姿态（默认·深度限知）**：全程锁死主视角角色的此刻感知，只写她此刻看到/听到/闻到/身体感到/脑中闪过的；镜头不拉远、不俯瞰、不切他人内心；读者与她同步获知，不提前剧透、不补全背景；念头用"闪念+身体"呈现，不写完整理性独白；场景被她的情绪染色，不写中立摄像机式描述。这条是去说教/上帝感的根（详见 `story-setup/references/agent-references/writing-craft.md`「视角姿态：深度限知」、`story-setup/references/agent-references/anti-ai-writing.md` 模式 8）。
**短篇题材包例外**：当调用方 prompt 已内联短篇题材风格包，或明确「第一人称在场、可主观审判 / 火葬场前瞻预告」时，按题材包走在场叙述——允许主角主观审判句、向前剧透 payoff，只删中立无情绪的作者讲解。长篇默认仍锁深度限知。

1. **进入场景**：主角此刻在哪、在做什么（1-2 句切入）
2. **展开子事件**：每个子事件将发生、感知、反应三维度揉进同一段连续正文（详写的子事件合计 ≥100-150 字；过场/连接类 1-2 句带过，不要每个子事件平均用力，见 `story-setup/references/agent-references/writing-craft.md`「疏密分配」）
   - 发生：这件事出现了（1-2 句叙事，含具体细节）
   - 感知：主角注意到的感官细节（至少 1 个不同感官，聚焦一个物件或身体部位）
   - 反应：身体如何回应（具体的身体动作，可含一句极短的心理定格）
   - 三个维度织在同一段里，不按维度分段写。禁止"先写发生再补感知再补反应"的堆叠写法
   - 子事件之间用身体动作连接（~20 字）
   - **画面分段**：三维度揉进不等于一段到底。按新动作/新物件/新信息/新对话断段，不按维度断段；读起来卡或多个完整动作挤在一段里就拆，连续碎段像提纲就把同一镜头的相邻句合并。拆的是段落，句子内部仍是逗号长句（见 `story-setup/references/agent-references/anti-ai-writing.md` 规则 3）
3. **收尾**：钩子或情绪定格（1-2 句）

关键辅助技法（均见 `story-setup/references/agent-references/writing-craft.md`）：
- 身体细节替代情绪词
- 贯穿道具三次出现规则：每个物件出现 3 次，意义逐次翻转
- 一动一静节奏：动作段后接静止感知段
- 疏密分配 + 长短句交错：爽点 beat 写密、过场 beat 写疏；高潮压短句、沉淀放长句，忌通篇同长度（见 `story-setup/references/agent-references/writing-craft.md`「疏密分配」、`story-setup/references/agent-references/format-and-structure.md`「段落节奏」）
- 小节密度诊断：5 项清单逐条检查

### 情绪弧线执行

> 题材情绪策略参考 `story-setup/references/agent-references/emotional-arc-design.md`

- 情弦理论：锁定目标读者的核心情感弦，每节至少拨一次（`story-setup/references/agent-references/emotional-arc-design.md` 情绪弧线）
- 三机位法：近景（身体动作）/远景（环境氛围）/旁白（内心独白），交替切换
- 拉扯节奏：情绪不能一直升，要有回落再升
- 情绪烈度（反保守）：网文要强噱头、强爽、强情绪。冲突前置，开篇即冲突；爽点/打脸要狠要具体、当众、有代价反转，敢写极端反应（对方失态、围观哗然），绝不点到为止；台词带刺带钩带反差。GPT/Claude 默认偏"稳"，要刻意往烈了写，宁过火，不平淡（题材以克制为爽感的除外，如虐文/世情"来不及"类，按 genre-catalog 题材技法走克制路线）
- 白描手法：用最少的字传递最多的信息+情绪，忌华丽堆砌
- 五感描写法：每段调动 2-3 种感官，服务于情绪基调
- 环境交互法：角色情绪投射到环境细节，环境变化暗示情绪转折

### 开篇创作

> 完整开头设计见 `story-setup/references/agent-references/opening-design.md`

- 前 100 字事件密度 >= 3（见 `story-setup/references/agent-references/writing-craft.md`）
- 黄金三章法则（长篇）/ 开头 3 句定生死（短篇）
- 9 种开头技巧：冲突前置/信息差钩/反常行为/重生反常/超自然身份/灵魂旁观/悬念句/替嫁被弃/代入式提问

### 收尾创作

- 5 种结尾类型：余韵式/呼应式/开放式/反转再反转/金句式
- 贯穿道具第 3 次出现（回扣暴击）
- 章尾禁止升华式收束，用动作/对话/悬念让情节本身制造余韵

### 去AI味（7 Gate）

> 完整方法见 `story-setup/references/agent-references/anti-ai-writing.md`
> 禁用词表见 `story-setup/references/agent-references/banned-words.md`

- **Gate A 禁用词替换**：命运齿轮/如潮水般/仿佛春风/心猛地一沉/眼眶泛红等全部替换（查 `story-setup/references/agent-references/banned-words.md`）
- **Gate B 句式去套路**：连续排比/刻意对称/空洞抒情打散（`story-setup/references/agent-references/anti-ai-writing.md` AI 模式检测）；硬禁同句先否定再肯定的翻转句式，直接写后项或改成动作/细节呈现；普通名词、常见动作和临时概念不用双引号做“引号强调”，但角色对话、逐字直接引用、书名/代号及手机消息/公告/系统播报等场内载体原文必须保留合法引号
- **Gate C 心理描写外化**：默认情绪词 -> 身体状态（`story-setup/references/agent-references/anti-ai-writing.md` Show Don't Tell），一处到位即可，别为外化堆蹭袖口、攥裤管一类无功能小动作。**短篇题材包例外**：要求「情绪直给+焊体感」时直写情绪成语并紧跟一个身体反应焊住，只杀空泛无体感的 AI 情绪总结句（如「一丝悲伤涌上心头」）
- **Gate D 节奏调整**：只拆臃肿修饰、堆叠比喻、信息过载的长句，同构句打散；拆的是段落不是句子内部——叙述句维持 `story-setup/references/agent-references/anti-ai-writing.md` 规则 3 的句长带（逗号之间 8-12 字、整句 20-30 字）。长短按情绪 beat 交错：沉淀处放慢，冲突/反转处骤短
- **Gate E 对话去腔调**：所有角色同一语气 -> 差异化（需结合 character-designer 的语言风格档案）；对话标点跟权力位置/情绪匹配，质问才用问号，爆发峰值才少量感叹；犹豫、吞咽、打断或拖长用动作、短句或换行承担
- **Gate F 结尾去升华**：大段抒情收尾 -> 安静细节收尾
- **Gate G 去解释腔/上帝感/安排感**：删掉叙述者跳出角色当下的无功能解释、剧透、总结、定性、升华（「之所以/原来/这意味着/她不知道的是/殊不知/多年以后/演得真好」），因果与定性留给读者从动作对话里自己拼（`story-setup/references/agent-references/anti-ai-writing.md` 模式 8）。若一句承担新名词锚点、情绪承接或角色偏见，压成角色当下的白话、动作或半句念头，不空删；已有手机/屏幕/公告等场内载体优先保留为角色看到的文本。

系统性去AI三遍法（`story-setup/references/agent-references/anti-ai-writing.md`）：
- Pass 1：去泛化 -- 抽象词替换为具体细节
- Pass 2：去书面化 -- 书面腔替换为口语/动作
- Pass 3：回自然感 -- 注入停顿、犹豫、矛盾和口语感

去AI味补充判断：
- 白话但不注水：少用连续精致戏剧反应短语（头皮发紧、眼皮一跳、心口一沉、胃里翻涌）；能写普通动作/普通感觉就写普通动作/普通感觉，保留自然的“的/了/就/但是/已经/之后/没有”等连接。
- 任务卡点只在角色本来有要办的事、且卡点能带来信息/情绪/关系/代价/选择/伏笔变化时使用；不要为了显得自然或凑字数补流程。
- 比喻不是原罪：`metaphor-density-tic` 只提示复核；生活化、角色化、单个有功能的比喻可留，问题是堆叠、万能文学比喻和用比喻替代剧情推进。
- 文风指纹按题材：男频/军旅、现代日常、悬疑、科幻、古代的有效 cadence 不同；不要把盘龙腔、旧网文腔或第一人称声口当跨题材万能修法。

### 节长测量（确定性计数，服从细纲边界）

- 长篇以章为粒度、细纲 `字数目标` 为唯一权威。父流程会把批准情节点分成连续前后两组；你先写前组临时 segment，父流程调用且只调用一次 `storyctl.py wordcount checkpoint`，再把机器返回的 `actual / remaining_user_range` 与后组情节点交给你。不要估算、心算剩余量或用 `wc -c`；短篇仍按自身流程验收。
- 后组只完成尚未写的批准情节点，不得为达到范围新增独立事件、人物决定、关系变化、揭示或支线；剩余情节点完成后立即结束，即使仍低于范围也不加戏。
- 父流程组装后以 `chapter check` 收口。`under` 不补；`over` 仅在收到 `compress-once` + 机器区间时执行下条。
- **over 单次压缩**：净删且不增语义；保留全部批准情节点、事实、因果、选择、情绪兑现与钩子；不改细纲/目标/设定/tracking。优先删重复解释/反应/总结、装饰排比、无功能微动作；局部改写只为连贯，成稿必须更短。交父流程复检，不做第二轮。
- 其他情况不得为 target 补纲、加戏、大删、replacement 或完整重写；质量修复仍按其他 Gate。
- 去AI味/改写已有正文不得新增原文没有的情节、设定、关系或时间线；只能恢复被误删的信息，或把既有信息改成更自然的动作/对话表达。禁止为字数灌水。

### 写完后编排自检（长篇正文必做）

正文落盘后，先把本章**实际写成的形状**整理成一张**时空表**，再按它自检。**时空 = 时间连续 ＋ 地点相同**的一段连续的戏：

```
时空1  修车铺/白天         点1,3,2,4             交错
时空2  酒楼包间/当晚       点5,6,7(前半),8,9,10  交错
时空3  酒楼门口/散场       点7(后半)
时空4  出租屋/当夜         点11(跨度),12         交错
时空5  修车铺/次日清晨     点11(跨度),13
```

（**块内点位按正文实际落地顺序排列**，不按细纲编号顺序——时空1 里点3 实际插在点2 前面，表就照实写 1,3,2,4，让织法直接可见。点7 是切分点：包间里话到嘴边收住是前半，散场路上说出口是后半，拆开落在两处；点11 是跨度点：细纲写的就是从当夜守到次日开门的一段事，天然骑在两个时空上。）

- **时空是你划的，不是细纲给的**——按你实际写成的样子划，不是按细纲的分点划。
- **一个点可以横跨两个时空**，两种情况都合法：
  - **跨度点**：细纲那个点本身写的就是一段时长或多次重复（「一连两天」「他每晚躺下都先等一阵」），天然骑在多个时空上。
  - **切分点**：你把一个点拆开落在两处（一句没问出口的话在饭桌上憋住了，回屋才说出来）。**这是好事，是平推的反面**，每一处都要有实在内容。
  - 横跨时在表里显式标出：跨度点在它骑的每一行都写 `点N(跨度)`；切分点按落点写 `点N(前半)` / `点N(后半)`。两种记法不混用。
- 自检三条，命中即就地重织再交付：
  1. **覆盖**：细纲每个情节点在时空表里**至少出现一次**；横跨多个时空的必须标注出来，不许隐去。有漏即补。
  2. **平推**：时空表如果基本是「一个时空一个点」，说明你在按细纲顺序平推——回去对块内的点两两跑形状层那条判据（乙点的一句插进甲点中间，剧情坏不坏），不坏的就该交错。
  3. **串行有据**：凡是划在同一时空却仍然写成一前一后的点，你要能说出理由（因果依赖／刻意的节拍分隔）。说不出就是平推。
- **时空表随交付摘要返回**，主会话据它核漏项与形状。宁可如实报出「一个时空一个点」也不要虚报「交错」——虚报会在成品复核时被拆穿。

### 写完后对话自检（涉及对话的章节必做）

正文含对话时，写完每章/每节后除字数外，按下列各项逐句自检并就地改写（技法见 `story-setup/references/agent-references/dialogue-mastery.md`）——**这是常规收尾步，不依赖外部审查是否被 spawn**：① 机械对话（信息倾倒/问答式/句间无情绪承接）；② 角色当"科普嘴"（整段讲设定/原理，Gate G 同样管台词）；③ 说话不分场合（高压 beat 的玩笑/口头梗/插科打诨出戏）；④ 高位者长篇自证掉价（改成行动或一句压迫性回应）；⑤ 捧哏工具人（改成实际反应、吃瘪或行动）；⑥ 情绪水肿咆哮（压成短句、动作破坏或生理反馈）；⑦ 鹦鹉学舌复读；⑧ 生死场景嘴碎；⑨ 过早打断悬念。命中即改，改完再交付。

### 写完后文风自检（有对标书 / `文风.md` / 主会话传入 `style_profile_summary` 时必做，防续写文风漂移）

长篇续写到一定篇幅，正文容易渐渐漂离对标书文风——典型是越写越碎、句子被切成三五字、逗号/句号堆成「逗号结巴体」。每章写完后除字数外按下方核对一次，**漂了就当场拉回重写再交付**：

1. 取目标句长带——优先使用主会话本章传入的 `style_profile_summary`（对应文件见 `style_profile_path`）；否则读取**有数值的「句长分布」字段**（短句<15字占比 / 中句 / 长句 / 平均句长，`confidence: high`）：自定义文风 `设定/文风.md` 有数值则用它，无数值（自写文风常是散文式）时退到对标 `文风.md` 的句长分布（即便它已降为参考）；都没有时以「原文锚点片段」语感为准。续写状态卡不存文风。
2. 粗测本章正文：标点（`。！？，、；`）分隔的句段是否大量不足 6 字、平均句段明显短于目标带、通篇碎句无呼吸感。
3. 命中即判**文风漂移**：按目标句长带把碎句合并成中长句、补回画面与连接、恢复叙述呼吸，重排后再交付。**续写衔接的是剧情、不是上一章的句式节奏——文风以 `style_profile_summary` / `设定/文风.md` / 对标 `文风.md` / 原文锚点为准，不以可能已漂移的上一章为准。**

