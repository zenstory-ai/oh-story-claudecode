name: Cross-platform smoke test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22.6+ lets test-prose-net-parity execute plugin.ts directly.
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run skill static check
        run: bash scripts/static-check.sh
      - name: Structured static-check regression
        run: python3 scripts/test-static-check.py
      - name: Check workflow numbering
        run: python3 scripts/skill-numbering.py check
      - name: Workflow numbering regression
        run: bash scripts/test-skill-numbering.sh
      - name: Check current-only skill contracts
        run: bash scripts/check-current-skill-contracts.sh
      - name: Current-only skill contract regression
        run: python3 scripts/test-current-skill-contracts.py
      - name: Agent permission behavior regression
        run: python3 scripts/test-agent-permissions.py
      - name: Check hot-path doc budget
        run: bash scripts/check-doc-budget.sh
      - name: Check hook-regex sync
        run: bash scripts/check-hook-regex-sync.sh
      - name: Check shared-file consistency
        run: bash scripts/check-shared-files.sh
      - name: Shared-asset manifest regression
        run: python3 scripts/test-shared-assets.py
      - name: Shared-reference manifest regression
        run: python3 scripts/test-shared-references.py
      - name: Punctuation normalizer regression
        run: node scripts/test-normalize-punctuation.js
      - name: Scan runtime regression
        run: node scripts/test-scan-runtime.js
      - name: Check scan/browser runtime source policies
        run: bash scripts/check-scan-runtime-policy.sh
      - name: Scan/browser source-policy mutation regression
        run: python3 scripts/test-scan-runtime-policy.py
      - name: AI-pattern detector regression
        run: bash scripts/test-ai-patterns.sh
      - name: Outline-copy detector regression
        run: bash scripts/test-outline-copy.sh
      - name: Phase 2 contract verifier regression
        run: |
          node scripts/test-phase2-contract.js
          node scripts/test-delivery-contract.js
          node scripts/check-reference-gates.js
          node scripts/test-outline-contract.js
      - name: Degeneration detector regression
        run: bash scripts/test-degeneration.sh
      - name: Prose backstop hook regression
        run: bash scripts/test-prose-backstop-hook.sh
      - name: Prose net 3-CLI parity
        run: bash scripts/test-prose-net-parity.sh
      - name: Story continuity backstop regression
        run: bash scripts/test-story-continuity.sh
      - name: Tracking transaction behavior regression
        run: python3 scripts/test-tracking-commit.py
      - name: Wordcount core behavior regression
        run: python3 scripts/test-storyctl.py
      - name: Chapter completion lifecycle regression
        run: python3 scripts/test-chapter-completion-lifecycle.py
      - name: Author memory transaction behavior regression
        run: python3 scripts/test-author-memory-commit.py
      - name: Check story-setup deployment
        run: bash scripts/check-story-setup-deployment.sh
      - name: Check Claude Code adapter
        run: bash scripts/check-claude-adapter.sh
      - name: Check Codex adapter
        run: bash scripts/check-codex-adapter.sh
      - name: Check Antigravity adapter
        run: bash scripts/check-antigravity-adapter.sh
      - name: Check OpenCode adapter
        run: bash scripts/check-opencode-adapter.sh
      - name: Check OpenClaw skill compatibility
        run: bash scripts/check-openclaw-skills.sh
      - name: Check ZCode adapter
        run: bash scripts/check-zcode-adapter.sh
      - name: Check Reasonix adapter
        run: bash scripts/check-reasonix-adapter.sh
      - name: Test Codex hook adapter
        run: bash scripts/test-codex-hooks.sh
      - name: Test ZCode hook adapter
        run: bash scripts/test-zcode-hooks.sh
      - name: Guard against bare python3 invocations
        run: bash scripts/check-python-invocation.sh
      - name: Guard hook locale safety (LC_ALL=C + no full-width char classes)
        run: bash scripts/check-hook-locale-safety.sh
      # Generate a GBK-class locale so the hook test's Part 2 runs end-to-end here,
      # not just on macOS. Best-effort: if it fails the test self-skips Part 2.
      - name: Generate zh_CN.GBK locale (Chinese Windows simulation)
        run: sudo localedef -f GBK -i zh_CN zh_CN.GBK || sudo locale-gen zh_CN.GBK || true
      - name: Hook path-encoding portability (cp936 + real GBK locale)
        run: bash scripts/test-hook-encoding-portable.sh
      - name: Portable char-count (real interpreter)
        run: bash scripts/test-charcount-portable.sh
      - name: Portable char-count (simulated Windows Store stub)
        run: bash scripts/test-charcount-portable.sh --stub
      - name: Syntax-check collection scripts
        run: |
          find skills \( -name '*-scraper.js' -o -name 'cdp-utils.js' -o -name 'setup-cdp-chrome.js' \) -print0 |
          while IFS= read -r -d '' f; do
            echo "node --check $f"
            node --check "$f"
          done

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: AI-pattern detector regression
        shell: bash
        run: bash scripts/test-ai-patterns.sh
      - name: Outline-copy detector regression
        shell: bash
        run: bash scripts/test-outline-copy.sh
      - name: Phase 2 contract verifier regression
        run: |
          node scripts/test-phase2-contract.js
          node scripts/test-delivery-contract.js
          node scripts/check-reference-gates.js
          node scripts/test-outline-contract.js
      - name: Degeneration detector regression
        shell: bash
        run: bash scripts/test-degeneration.sh
      - name: Prose backstop hook regression
        shell: bash
        run: bash scripts/test-prose-backstop-hook.sh
      - name: Prose net 3-CLI parity
        shell: bash
        run: bash scripts/test-prose-net-parity.sh
      - name: Story continuity backstop regression
        shell: bash
        run: bash scripts/test-story-continuity.sh
      - name: Tracking transaction behavior regression
        run: python scripts/test-tracking-commit.py
      - name: Wordcount core behavior regression
        run: python scripts/test-storyctl.py
      - name: Chapter completion lifecycle regression
        run: python scripts/test-chapter-completion-lifecycle.py
      - name: Author memory transaction behavior regression
        run: python scripts/test-author-memory-commit.py
      - name: Workflow numbering regression
        shell: bash
        run: bash scripts/test-skill-numbering.sh
      - name: Check shared-file consistency (Windows Git Bash)
        shell: bash
        run: bash scripts/check-shared-files.sh
      - name: Punctuation normalizer regression
        run: node scripts/test-normalize-punctuation.js
      - name: Scan runtime regression
        run: node scripts/test-scan-runtime.js
      - name: Test Codex hook adapter
        shell: bash
        run: bash scripts/test-codex-hooks.sh
      - name: Test ZCode hook adapter
        shell: bash
        run: bash scripts/test-zcode-hooks.sh
      - name: Test Antigravity hook adapter
        run: node scripts/test-antigravity-hooks.mjs
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Verify cdp-utils loads
        run: node -e "const u = require('./skills/story-short-scan/scripts/cdp-utils.js'); console.log('exports:', Object.keys(u));"
      - name: Verify sleep works
        run: node -e "const { sleep } = require('./skills/story-short-scan/scripts/cdp-utils.js'); const t0 = Date.now(); sleep(100); console.log('slept', Date.now()-t0, 'ms');"
      - name: Verify setup script dry-run
        run: node skills/browser-cdp/scripts/setup-cdp-chrome.js 9222 --dry-run
      # Run under Git Bash (shell: bash on windows-latest), matching how Claude Code
      # executes its Bash tool on Windows — this is where the python3 exit-49 bug bites.
      - name: Portable char-count (real interpreter)
        shell: bash
        run: bash scripts/test-charcount-portable.sh
      - name: Portable char-count (simulated Windows Store stub)
        shell: bash
        run: bash scripts/test-charcount-portable.sh --stub
      # Real Windows Git Bash path: the cp936 stdout bug (issue #164) bites here.
      - name: Hook path-encoding portability (cp936 + GBK locale if present)
        shell: bash
        run: bash scripts/test-hook-encoding-portable.sh

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: AI-pattern detector regression
        run: bash scripts/test-ai-patterns.sh
      - name: Outline-copy detector regression
        run: bash scripts/test-outline-copy.sh
      - name: Phase 2 contract verifier regression
        run: |
          node scripts/test-phase2-contract.js
          node scripts/test-delivery-contract.js
          node scripts/check-reference-gates.js
          node scripts/test-outline-contract.js
      - name: Degeneration detector regression
        run: bash scripts/test-degeneration.sh
      - name: Prose backstop hook regression
        run: bash scripts/test-prose-backstop-hook.sh
      - name: Prose net 3-CLI parity
        run: bash scripts/test-prose-net-parity.sh
      - name: Story continuity backstop regression
        run: bash scripts/test-story-continuity.sh
      - name: Tracking transaction behavior regression
        run: python3 scripts/test-tracking-commit.py
      - name: Wordcount core behavior regression
        run: python3 scripts/test-storyctl.py
      - name: Chapter completion lifecycle regression
        run: python3 scripts/test-chapter-completion-lifecycle.py
      - name: Author memory transaction behavior regression
        run: python3 scripts/test-author-memory-commit.py
      - name: Workflow numbering regression
        run: bash scripts/test-skill-numbering.sh
      - name: Punctuation normalizer regression
        run: node scripts/test-normalize-punctuation.js
      - name: Scan runtime regression
        run: node scripts/test-scan-runtime.js
      - name: Check shared-file consistency (macOS Bash 3)
        run: bash scripts/check-shared-files.sh
      - name: Check Codex adapter
        run: bash scripts/check-codex-adapter.sh
      - name: Test Codex hook adapter
        run: bash scripts/test-codex-hooks.sh
      - name: Test ZCode hook adapter
        run: bash scripts/test-zcode-hooks.sh
      - name: Test Antigravity hook adapter
        run: node scripts/test-antigravity-hooks.mjs
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Verify cdp-utils loads
        run: node -e "const u = require('./skills/story-short-scan/scripts/cdp-utils.js'); console.log('exports:', Object.keys(u));"
      - name: Verify sleep works
        run: node -e "const { sleep } = require('./skills/story-short-scan/scripts/cdp-utils.js'); const t0 = Date.now(); sleep(100); console.log('slept', Date.now()-t0, 'ms');"
      - name: Verify setup script dry-run
        run: node skills/browser-cdp/scripts/setup-cdp-chrome.js 9222 --dry-run
      - name: Portable char-count (real interpreter)
        run: bash scripts/test-charcount-portable.sh
      - name: Portable char-count (simulated Windows Store stub)
        run: bash scripts/test-charcount-portable.sh --stub
      - name: Hook path-encoding portability (cp936 + GBK locale if present)
        run: bash scripts/test-hook-encoding-portable.sh
