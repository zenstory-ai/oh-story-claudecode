name: Cross-platform smoke test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-lint-and-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 22.6+ lets test-opencode-plugin.mjs (via check-opencode-adapter) execute plugin.ts directly.
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Repo lint & doc budget
        run: |
          python3 scripts/lint-repo.py
          node scripts/check-doc-budget.mjs
      - name: Repo guard & contract regressions
        run: |
          python3 scripts/test-static-check.py
          python3 scripts/test-current-skill-contracts.py
          python3 scripts/test-handoff-contracts.py
          python3 scripts/test-doc-budget.py
          python3 scripts/test-shared-assets.py
          python3 scripts/test-shared-references.py
          python3 scripts/test-agent-permissions.py
      - name: Source & runtime policy guards
        run: |
          bash scripts/check-scan-runtime-policy.sh
          python3 scripts/test-scan-runtime-policy.py
          bash scripts/check-python-invocation.sh
      - name: Check story-setup deployment
        run: bash scripts/check-story-setup-deployment.sh
      - name: Check 7 host adapters
        run: |
          bash scripts/check-claude-adapter.sh
          bash scripts/check-codex-adapter.sh
          bash scripts/check-antigravity-adapter.sh
          bash scripts/check-opencode-adapter.sh
          bash scripts/check-openclaw-skills.sh
          bash scripts/check-zcode-adapter.sh
          bash scripts/check-reasonix-adapter.sh
      - name: Syntax-check collection scripts
        run: |
          find skills \( -name '*-scraper.js' -o -name 'cdp-utils.js' -o -name 'aggregate-rank.js' -o -name 'setup-cdp-chrome.js' \) -print0 |
          while IFS= read -r -d '' f; do
            echo "node --check $f"
            node --check "$f"
          done

  cross-platform-runtime:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Cross-runtime plugin packaging
        run: |
          python scripts/check-plugin-packaging.py
          python scripts/test-plugin-packaging.py
      - name: Native Node detector & contract tests
        run: |
          node --test scripts/test-ai-patterns.mjs scripts/test-degeneration.mjs scripts/test-outline-copy.mjs
          node scripts/test-phase2-contract.js
          node scripts/test-delivery-contract.js
          node scripts/test-outline-contract.js
          node scripts/test-normalize-punctuation.js
          node scripts/test-scan-runtime.js
      - name: Python runtime regressions
        run: |
          python scripts/test-publish-format.py
          python scripts/test-writer-pipeline.py
          python scripts/test-style-precedence.py
          python scripts/test-tracking-commit.py
          python scripts/test-storyctl.py
          python scripts/test-chapter-completion-lifecycle.py
          python scripts/test-author-memory-commit.py
          python scripts/test-long-analyze-runtime.py
          python scripts/test-scan-aggregate.py
      # Generate a GBK-class locale on Ubuntu so the GBK test in test-claude-hooks.mjs runs end-to-end.
      - name: Generate zh_CN.GBK locale (Chinese Windows simulation)
        if: matrix.os == 'ubuntu-latest'
        run: sudo localedef -f GBK -i zh_CN zh_CN.GBK || sudo locale-gen zh_CN.GBK || true
      - name: Hook & continuity regressions
        shell: bash
        run: |
          node --test scripts/test-story-hook-core.mjs scripts/test-claude-hooks.mjs scripts/test-codex-hooks.mjs scripts/test-antigravity-hooks.mjs scripts/test-zcode-hooks.mjs
          node --experimental-strip-types --test scripts/test-opencode-plugin.mjs
      - name: Portable char-count tests
        shell: bash
        run: |
          bash scripts/test-charcount-portable.sh
          bash scripts/test-charcount-portable.sh --stub
      - name: Setup Chrome
        if: matrix.os != 'ubuntu-latest'
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        with:
          chrome-version: stable
      - name: Verify Chrome CDP helpers & setup dry-run
        if: matrix.os != 'ubuntu-latest'
        run: |
          node -e "const { sleep } = require('./skills/story-short-scan/scripts/cdp-utils.js'); const t0 = Date.now(); sleep(100); const ms = Date.now() - t0; console.log('slept', ms, 'ms'); if (ms < 90) { console.error('sleep(100) returned after ' + ms + 'ms'); process.exit(1); }"
          node skills/browser-cdp/scripts/setup-cdp-chrome.js 9222 --dry-run
